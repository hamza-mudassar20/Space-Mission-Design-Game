function menu(){F=null;bg.spT=0;S.step=0;scene([SUN,{k:'jup',x:.78,y:.7,r:.46}],[8,175],{rocks:true});
 screen(`<div class="c"><div class="tag">NASA Space Apps Challenge 2026</div><h1>CYGNOVA</h1><p class="sub">MISSION FORGE · Design it. Launch it. Learn from it.</p><p style="margin:26px 0 8px;font-size:18px">Do you want to start the game or continue the game?</p>
 <div><button class="b go" data-a="new">START NEW GAME</button></div><div><button class="b" data-a="cont" ${Object.keys(SAVE.stars).length?'':'disabled'}>CONTINUE GAME</button></div>
 <div><button class="b sm" data-a="how">HOW TO PLAY</button><button class="b sm" data-a="snd">SOUND ${snd?'ON':'OFF'}</button></div></div>`)}
function go(n,anim=true){n=+n;S.step=n;const c=calc(),m=M[S.m];
 if(n===0){scene([SUN,{k:'moon',x:.3,y:.5,r:.06},{k:'earth',x:.42,y:.5,r:.09},{k:'mars',x:.54,y:.5,r:.07},{k:'jup',x:.7,y:.5,r:.19},{k:'sat',x:.92,y:.5,r:.14,ring:1,tilt:-.3}],[345,175],{rocks:true});
  screen(`<div class="c">${dots(0)}<h2>Choose your mission</h2><p class="sub">Where will your spacecraft go?</p><div class="grid">${Object.entries(M).map(([k,q])=>card(false,'mis',k,emb(k),q.title,`${q.name} · ${q.goal}<br><span style="display:inline-block;margin-top:8px">${stars3(SAVE.stars[k]||0,22)}</span>`)).join('')}</div><button class="b sm" data-a="menu">BACK</button></div>`,anim);return}
 if(n===1){scene([{k:'earth',x:.3,y:1.12,r:.62},{k:'sun',x:-.14,y:.2,r:.22}],[20,190],{station:true});
  screen(`<div class="c">${dots(1)}${meters(c)}<h2>Pick a rocket</h2><p class="sub">${m.title} · Heavier missions need a stronger rocket.</p><div class="grid">${R.map((r,i)=>card(S.r===i,'rk',i,`<div style="height:210px;width:90px">${rkSvg(i)}</div>`,r.n,`${r.t}<br>Lifts ${r.cap} kg · $${r.c}M`)).join('')}</div>${nav(0,2)}</div>`,anim);return}
 if(n===2){scene([{k:'sat',x:.76,y:.55,r:.4,ring:1,tilt:-.35},{k:'sun',x:-.15,y:.3,r:.28}],[30,300],{rocks:true});
  screen(`<div class="c">${dots(2)}${meters(c)}<h2>Pick science tools</h2><p class="sub">Choose 1 to 3. Every tool adds weight, cost and data.</p><div class="grid">${m.ins.map((n,i)=>card(S.i.includes(i),'in',i,ICON[n.n],n.n,`${n.t}<br>Science ${n.s} · $${n.c}M · ${n.m} kg`)).join('')}</div>${nav(1,3,!S.i.length)}</div>`,anim);return}
 if(n===3){scene([{k:S.m,x:.78,y:.55,r:.3},{k:'sun',x:-.16,y:.4,r:.28}],[10,175],{orbit:{k:S.m,sel:S.o}});
  screen(`<div class="c">${dots(3)}${meters(c)}<h2>Pick an orbit</h2><p class="sub">Lower orbits see more detail. The star marks a real NASA orbit.</p><div class="grid">${m.orb.map((o,i)=>card(S.o===i,'ob',i,orbIc(i,o.nasa),o.n,o.t)).join('')}</div>${nav(2,4)}</div>`,anim);return}
 if(n===4){scene([{k:S.m,x:.74,y:.58,r:.34},{k:'sun',x:-.16,y:.4,r:.28}],[350,175]);
  screen(`<div class="c">${dots(4)}${meters(c)}<h2>${m.title}</h2><div style="display:flex;gap:20px;justify-content:center;align-items:center;flex-wrap:wrap;margin:10px 0"><div style="height:170px;width:75px">${rkSvg(S.r)}</div><div class="panel rows" style="margin:0;text-align:left;min-width:min(380px,86vw)"><div class="row2"><span>Rocket</span><b>${c.r.n}</b></div><div class="row2"><span>Tools</span><b>${c.ins.map(i=>i.n).join(', ')||'none'}</b></div><div class="row2"><span>Orbit</span><b>${c.o.n}</b></div><div class="row2"><span>Science score</span><b style="color:var(--am)">${Math.round(c.sci)}</b></div></div></div>
  <div class="tip ${c.ok?'ok':'bad'}">${c.ok?'Ready for launch. Try other choices to score higher.':c.tip}</div><br><button class="b sm" data-a="auto">AUTO-PICK BEST</button><button class="b sm" data-a="go" data-v="3">BACK</button><br><button class="b go" data-a="launch" ${c.ok?'':'disabled'}>LAUNCH</button></div>`,anim)}}
function launch(){const c=calc();F={c,ph:'pad',t:0,p:0,int:100,sci:0,ev:[],evs:[...POOL].sort(()=>Math.random()-.5).slice(0,2),n:0,paused:false,ang:0,fire:false};bg.orbit=null;scene([{k:'earth',x:.5,y:1.45,r:1.0}],[18,175]);
 let n=3;const tick=()=>{if(n>0){screen(`<div class="cd">${n}</div>`);beep(440,.2,'square');n--;setTimeout(tick,1000)}else{screen(`<div class="cd" style="color:var(--em)">LIFTOFF</div>`);beep(120,1.6,'sawtooth',.08);F.fire=true;setTimeout(()=>{F.ph='ascent';F.t=0;scene([{k:'earth',x:.5,y:S.m==='earth'?1.9:2.8,r:1.2}]);hud()},800)}};tick()}
function hud(){ui.innerHTML=`<div class="hud"><div class="r"><span id="hl">ASCENT</span><span>Day <b id="hd">0</b> · Health <b id="hi">100</b>%</span></div><div class="bar"><i class="g" id="hb" style="width:0"></i></div></div><div id="ev" style="margin:auto"></div>`;ui.classList.remove('in')}
function event(){F.paused=true;const e=F.evs[F.n];beep(300,.4,'triangle');document.getElementById('ev').innerHTML=`<div class="panel in" style="text-align:center"><div class="tag">Mission alert ${F.n+1} of 2</div>${EVI[e.i]}<h2 style="margin:8px 0">${e.t}</h2><p class="sub" style="margin:8px 0 16px">${e.d}</p><button class="b" data-a="ch" data-v="a">SAFE · ${e.a[0]}<br><small style="letter-spacing:.04em;text-transform:none;font-weight:400">${e.a[1]}</small></button><button class="b go" data-a="ch" data-v="b">BOLD · ${e.b[0]}<br><small style="letter-spacing:.04em;text-transform:none;font-weight:400">${e.b[1]}</small></button></div>`}
function choose(v){const e=F.evs[F.n],o=e[v];F.int=cl(F.int+o[2],0,100);F.sci+=o[3];F.ev.push(`${e.t}: ${o[0]} (health ${o[2]>0?'+':''}${o[2]}, science ${o[3]>0?'+':''}${o[3]})`);F.n++;document.getElementById('ev').innerHTML='';F.paused=false}
function finish(){const c=F.c,m=c.m,sp=cl(c.sci/m.ref*100+F.sci,0,100),ec=cl(40+60*(1-c.cost/m.budget),0,100),score=Math.round(.55*sp+.3*F.int+.15*ec),st=score>=85?3:score>=65?2:1;
 SAVE.stars[S.m]=Math.max(SAVE.stars[S.m]||0,st);store();beep(880,.5);F.res={score,st,sp,ec};const tips=[];if(sp<70)tips.push('Pick stronger tools or the NASA orbit to boost science.');if(F.int<75)tips.push('Safe choices protect the spacecraft. Health counts toward your score.');if(ec<45)tips.push('A cheaper design leaves budget to spare.');if(!tips.length)tips.push('Great balance of science, safety and cost.');
 const keys=Object.keys(M),next=keys[(keys.indexOf(S.m)+1)%3],row=(l,v)=>`<div class="row2"><span>${l}</span><b>${Math.round(v)}%</b></div><div class="bar" style="margin:4px 0 8px"><i class="${v>70?'g':v>45?'y':'r'}" style="width:${v}%"></i></div>`;
 scene([{k:S.m,x:.5,y:1.05,r:.5},{k:'sun',x:-.15,y:.3,r:.28}],[350,175]);bg.spT=0;
 screen(`<div class="c"><div class="tag">Mission complete · ${m.title}</div><div class="sc">${score}</div><div style="margin:6px 0">${stars3(st,44)}</div><div class="panel rows" style="margin-top:12px">${row('Science',sp)}${row('Spacecraft health',F.int)}${row('Money smarts',ec)}<p style="margin-top:8px">${tips.join(' ')}</p><p style="opacity:.8;margin-top:6px">NASA fact: ${m.fact}</p></div>
 <button class="b go" data-a="mis" data-v="${S.m}">TRY AGAIN</button><button class="b" data-a="mis" data-v="${next}">NEXT MISSION</button><br><button class="b sm" data-a="rep">DOWNLOAD REPORT</button><button class="b sm" data-a="menu">MENU</button></div>`)}
function report(){const r=F.res,c=F.c,t=`CYGNOVA MISSION FORGE — REPORT\nMission: ${c.m.title} (${c.m.name})\nScore: ${r.score}/100  Stars: ${r.st}/3\nRocket: ${c.r.n}\nTools: ${c.ins.map(i=>i.n).join(', ')}\nOrbit: ${c.o.n}\nCost: $${c.cost}M / $${c.m.budget}M\nMass: ${c.mass} / ${c.r.cap} kg\nPower: ${c.pw} / ${c.m.power} W\nData: ${c.dt} / ${c.m.data} GB/day\nEvents:\n${F.ev.join('\n')}\n\nNASA fact: ${c.m.fact}\nAll non-NASA values are fictional teaching numbers. Independent project, not NASA endorsed. Code is AI-assisted.\n`,a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download='CYGNOVA_Report_'+c.m.name+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
const act={new(){SAVE.stars={};store();go(0)},cont(){go(0)},menu,go:v=>go(v),snd(){toggleSnd();menu()},
 how(){screen(`<div class="panel"><h2>How to play</h2><div class="rows">1. Pick a destination.<br>2. Choose a rocket, science tools and an orbit. Keep all four bars out of the red.<br>3. Launch. Two surprises will happen: choose SAFE or BOLD.<br>4. Earn up to 3 stars. Orbits marked with a star are real NASA mission altitudes.</div><button class="b" data-a="menu">GOT IT</button></div>`)},
 mis(v){S={m:v,r:v==='moon'?1:v==='mars'?2:0,i:[0,1],o:M[v].orb.findIndex(o=>o.nasa),step:1};F=null;bg.spT=0;go(1)},
 rk(v){S.r=+v;go(1,false)},in(v){v=+v;S.i=S.i.includes(v)?S.i.filter(x=>x!==v):[...S.i,v];go(2,false)},ob(v){S.o=+v;bg.orbit&&(bg.orbit.sel=S.o);go(3,false)},auto(){autoPick();go(4,false)},launch,ch:choose,rep:report};
function intro(){scene([{k:'earth',x:.5,y:1.3,r:.8}],[8,175]);screen(`<div class="q">“The Earth is the cradle of humanity, but one cannot live in a cradle forever.”<small>KONSTANTIN TSIOLKOVSKY</small></div>`);setTimeout(()=>{ui.innerHTML=''},4400);setTimeout(menu,5500)}
screen('<div class="c"><div class="tag">Loading the solar system</div></div>');
setTimeout(()=>{for(const [k,s] of [['earth',1],['cloud',5],['moon',3],['mars',7],['jup',2],['sat',9],['sun',4]])TX[k]=tex(k,s);requestAnimationFrame(frame);intro()},60);
</script></body></html>
